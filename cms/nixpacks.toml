[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20"]

[phases.install]
cmds = []

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --ignore-platform-req=php"
]

[start]
cmd = "export PHP_CLI_SERVER_WORKERS=4 && php artisan storage:link && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
